{% extends 'base.html' %}{% block content %}<h1>{{ course.title }}</h1><p>{{ course.description }}</p><div class="py-grid">{% for l in lessons %}<div class="py-card"><h3>{{ l.lesson_order }}. {{ l.title }}</h3><p>{{ l.summary }}</p><a class="py-btn" href="{{ url_for('lesson',lid=l.id) }}">Open Lesson</a><a class="py-btn" href="{{ url_for('games') }}">Games</a></div>{% endfor %}</div>{% endblock %}
