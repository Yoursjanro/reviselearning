<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}E-Learning{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"><style>
:root{--bg:#070914;--panel:#0c1326;--line:#293b5b;--muted:#b5c4e1;--cyan:#4deaff;--pink:#c33763;--grad:linear-gradient(110deg,#1768a9,#5940b8 58%,#852f9e)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(ellipse at 8% 0%,rgba(61,86,220,.22),transparent 42%),radial-gradient(ellipse at 94% 22%,rgba(151,46,201,.18),transparent 38%),linear-gradient(180deg,#070914,#0a1020 55%,#070914);color:#edf4ff}body{background-attachment:fixed}.topbar{height:64px;background:#050917;border-bottom:1px solid #263650;display:flex;align-items:center;justify-content:space-between;padding:0 max(calc((100% - 1200px)/2),24px);gap:20px}.brand{font-size:21px;font-weight:800;color:#fff;text-decoration:none;white-space:nowrap}.navlinks{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.navlinks a{padding:10px 12px;color:#d9e4f8;text-decoration:none;border-radius:9px;font-size:15px}.navlinks a:hover{background:#16213a;color:#fff}.navlinks .logout{background:linear-gradient(120deg,#7d2148,#c33763);border:1px solid #e54e81;color:#fff;padding:12px 16px}.container{width:min(1200px,calc(100% - 40px));margin:32px auto 48px}.py-card,.hero,.stat{background:linear-gradient(145deg,rgba(18,27,50,.97),rgba(8,14,29,.98));border:1px solid #293b5b;border-radius:18px;padding:22px;color:#edf4ff;box-shadow:0 14px 36px #0005;margin:0 0 18px}.py-card h2,.py-card h3{margin-top:0}.muted,.py-muted{color:#b5c4e1}.py-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px;margin:18px 0}.py-grid .py-card{margin:0}.py-btn,button{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 16px;border:1px solid #344766;border-radius:11px;background:#121d34;color:#f2f7ff;text-decoration:none;font-weight:700;cursor:pointer;font-size:14px}.py-btn.primary,button.primary{background:var(--grad);border-color:#6389f0}.py-btn.danger,button.danger{background:linear-gradient(120deg,#7d2148,#c33763);border-color:#ca4876}.py-btn:hover,button:hover{filter:brightness(1.13);transform:translateY(-1px)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}table{width:100%;border-collapse:collapse;overflow:hidden;border-radius:12px}th{background:#111e36;color:#9defff;text-transform:uppercase;font-size:12px;letter-spacing:.04em}td,th{text-align:left;padding:15px;border-bottom:1px solid #24334c;vertical-align:top}tr:last-child td{border-bottom:0}td{color:#e0e9fa}input,textarea,select{width:100%;padding:12px;margin:7px 0 15px;background:#080f21;color:#f1f6ff;border:1px solid #394969;border-radius:9px;font:inherit}textarea{min-height:90px}label{font-size:14px;font-weight:700;color:#dbe7ff}.py-flash{background:#12372f;color:#a5ffdb;border:1px solid #27664e;padding:12px 15px;border-radius:10px;margin-bottom:14px}.stat{min-height:195px;display:block;text-decoration:none;transition:.2s}.stat:hover{border-color:#4deaff;transform:translateY(-3px)}.stat-icon{font-size:24px;margin-bottom:14px}.stat-num{font-size:30px;color:#4deaff;font-weight:800;margin:12px 0}.stat-label{font-size:14px;color:#b5c4e1;line-height:1.7}.admin-hero{padding:36px 38px;min-height:178px}.admin-hero h1{font-size:32px;margin:0 0 22px}.section-title{margin:0 0 14px}.page-intro{margin-top:-5px;color:#b5c4e1}.hidden{display:none!important}.empty{padding:24px;text-align:center;color:#b5c4e1}@media(max-width:700px){.topbar{height:auto;padding:14px 16px;align-items:flex-start;flex-direction:column}.navlinks{gap:2px}.navlinks a{padding:8px;font-size:13px}.container{width:calc(100% - 24px);margin:20px auto}.admin-hero{padding:24px}.admin-hero h1{font-size:25px}.py-card{padding:16px}table{display:block;overflow-x:auto;white-space:nowrap}td,th{padding:11px}}
</style></head><body>{% if user %}<header class="topbar"><a class="brand" href="{{ url_for('dashboard') }}">🎓 E-Learning</a><nav class="navlinks"><a href="{{ url_for('dashboard') }}">Dashboard</a><a href="{{ url_for('courses') }}">Courses</a>{% if user.role=='admin' %}<a href="{{ url_for('admin_users') }}">Users</a><a href="{{ url_for('admin_reports') }}">Reports</a>{% else %}<a href="{{ url_for('quizzes') }}">Quizzes</a><a href="{{ url_for('games') }}">Games</a>{% endif %}<a class="logout" href="{{ url_for('logout') }}">Log Out</a></nav></header>{% endif %}<main class="container">{% for message in get_flashed_messages() %}<div class="py-flash">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main><script src="{{ url_for('static',filename='interactions.js') }}"></script></body></html>
